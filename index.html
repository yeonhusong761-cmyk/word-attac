<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Attack 5v5</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #08111f;
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    font-size: 42px;
}

.card {
    background: #16243a;
    border-radius: 18px;
    padding: 20px;
    margin: 15px 0;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

.hidden {
    display: none;
}

input {
    padding: 12px;
    border: none;
    border-radius: 10px;
    margin: 5px;
    font-size: 16px;
}

button {
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    margin: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #347ff0;
    color: white;
}

button:hover {
    transform: translateY(-1px);
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* 팀 */

.teams {
    display: flex;
    gap: 15px;
}

.team {
    flex: 1;
    padding: 18px;
    border-radius: 18px;
}

.blue {
    background: #104875;
}

.red {
    background: #721f32;
}

.hp-bar {
    width: 100%;
    height: 24px;
    background: #07101c;
    border-radius: 20px;
    overflow: hidden;
}

.hp {
    height: 100%;
    transition: width 0.3s;
}

.blue-hp {
    background: #38aaff;
}

.red-hp {
    background: #ff5068;
}

.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 12px;
}

.player {
    padding: 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.12);
}

/* 클래스 */

.class-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.class-button {
    background: #263750;
    border: 3px solid transparent;
    padding: 20px 10px;
}

.class-button.selected {
    border-color: white;
    background: #3b526f;
}

.class-button b {
    display: block;
    font-size: 20px;
    margin-bottom: 8px;
}

#classTimer {
    text-align: center;
    font-size: 65px;
    font-weight: bold;
}

/* 전투 */

.arena {
    height: 150px;
    background: linear-gradient(
        #111f33,
        #091321
    );

    border-radius: 15px;

    position: relative;

    overflow: hidden;

    margin-bottom: 20px;
}

.fighter {
    position: absolute;
    top: 50px;
    font-size: 45px;
}

.blue-fighter {
    left: 8%;
}

.red-fighter {
    right: 8%;
}

.bullet {
    position: absolute;
    top: 72px;
    height: 8px;
    border-radius: 10px;
    animation: shoot 0.4s linear forwards;
}

.blue-shot {
    left: 10%;
    background: #4cc8ff;
}

.red-shot {
    right: 10%;
    background: #ff5068;
}

@keyframes shoot {

    from {
        width: 0;
    }

    to {
        width: 80%;
    }

}

#meaning {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    margin: 20px;
}

#difficulty {
    text-align: center;
    color: #b7c4d8;
}

#hint {
    text-align: center;
    font-size: 25px;
    letter-spacing: 4px;
    min-height: 35px;
}

#status {
    text-align: center;
    min-height: 25px;
}


/* 전투 효과 */

#battleEffect {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    pointer-events: none;
    background: rgba(120, 80, 255, 0.16);
    backdrop-filter: blur(2px);
    animation: confusionShake 0.12s infinite;
}

#battleEffect.show {
    display: block;
}

#battleEffect .effectText {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(-3deg);
    font-size: clamp(32px, 7vw, 80px);
    font-weight: 900;
    text-shadow: 0 0 18px rgba(255,255,255,.8);
}

@keyframes confusionShake {
    0% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(4px, -2px) rotate(.5deg); }
    50% { transform: translate(-4px, 3px) rotate(-.5deg); }
    75% { transform: translate(2px, 2px) rotate(.4deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
}

#debuffStatus {
    text-align: center;
    min-height: 22px;
    font-weight: bold;
}

.center {
    text-align: center;
}

.small {
    color: #aebbd0;
}

@media(max-width:700px) {

    .teams {
        flex-direction: column;
    }

    .class-grid {
        grid-template-columns: 1fr 1fr;
    }

    #meaning {
        font-size: 30px;
    }

}

</style>
</head>

<script type="module">


/* =========================================================

const app =

const db =

/* =========================================================

========================================================= */

const myId =
    crypto.randomUUID();

let myName = "";

/* =========================================================

const WORDS = [

    ["오해하다", "misunderstood", "hard"]

];



/* =========================================================
   도우미
========================================================= */

function $(id) {

    return document.getElementById(id);

}


function randomWord() {

    return WORDS[
        Math.floor(
            Math.random() * WORDS.length
        )
    ];

}


function randomRoomCode() {

    return Math.random()
        .toString(36)
        .substring(2, 7)
        .toUpperCase();

}


function classIcon(className) {

    const icons = {

        rusher: "⚡",
        guardian: "🛡️",
        sniper: "🎯",
        support: "💚",
        confuser: "🌀",
        debuff: "🧪",
        chaos: "🎲",
        mirror: "🪞",
        king: "👑",
        equalizer: "⚖️"

    };

    return icons[className] || "❔";

}



/* =========================================================
   방 만들기
========================================================= */

window.createRoom = async function() {

    myName =
        $("playerName")
        .value
        .trim();


    if (!myName) {

        alert("닉네임을 입력해!");

        return;

    }


    roomId =
        randomRoomCode();


    myTeam =
        "blue";


    await set(

        ref(
            db,
            `rooms/${roomId}`
        ),

        {

            host: myId,

            status: "lobby",

            blueHP: 100,

            redHP: 100,

            attackCount: 0,

            confusionUntil: {},

            debuffs: {},

            players: {

                [myId]: {

                    name: myName,

                    team: "blue",

                    class: ""

                }

            }

        }

    );


    showLobby();

    listenRoom();

};



/* =========================================================
   방 참가
========================================================= */

window.joinRoom = async function() {

    myName =
        $("playerName")
        .value
        .trim();


    roomId =
        $("roomCodeInput")
        .value
        .trim()
        .toUpperCase();


    if (!myName || !roomId) {

        alert(
            "닉네임과 방 코드를 입력해!"
        );

        return;

    }


    const snapshot =
        await get(
            ref(
                db,
                `rooms/${roomId}`
            )
        );


    if (!snapshot.exists()) {

        alert(
            "그런 방이 없어!"
        );

        return;

    }


    const data =
        snapshot.val();


    const players =
        data.players || {};


    if (data.status !== "lobby") {

        alert(
            "이미 게임이 시작된 방이야!"
        );

        return;

    }


    if (
        Object.keys(players).length >= 10
    ) {

        alert(
            "방이 꽉 찼어!"
        );

        return;

    }


    const blueCount =
        Object.values(players)
        .filter(
            p => p.team === "blue"
        )
        .length;


    const redCount =
        Object.values(players)
        .filter(
            p => p.team === "red"
        )
        .length;


    /*
       사람이 적은 팀으로 자동 배정
    */

    myTeam =
        blueCount <= redCount
            ? "blue"
            : "red";


    await update(

        ref(
            db,
            `rooms/${roomId}/players/${myId}`
        ),

        {

            name: myName,

            team: myTeam,

            class: ""

        }

    );


    showLobby();

    listenRoom();

};



/* =========================================================
   로비 표시
========================================================= */

function showLobby() {

    $("login")
        .classList
        .add("hidden");


    $("lobby")
        .classList
        .remove("hidden");


    $("roomCode")
        .textContent =
        roomId;

}



/* =========================================================
   Firebase 방 감시
========================================================= */

function listenRoom() {

    if (unsubscribe) {

        unsubscribe();

    }


    unsubscribe =
        onValue(

            ref(
                db,
                `rooms/${roomId}`
            ),

            snapshot => {

                roomData =
                    snapshot.val();


                if (!roomData) {

                    return;

                }


                renderLobby();

                renderGameState();

            }

        );

}



/* =========================================================
   로비 렌더링
========================================================= */

function renderLobby() {

    const players =
        roomData.players || {};


    const list =
        Object.entries(players);


    $("playerCount")
        .textContent =
        list.length;


    $("lobbyPlayers")
        .innerHTML =

        list.map(

            ([id, player]) => `

            <div class="player">

                ${
                    player.team === "blue"
                    ? "🔵"
                    : "🔴"
                }

                ${player.name}

                ${classIcon(player.class)}

                ${
                    id === roomData.host
                    ? "👑"
                    : ""
                }

            </div>

            `

        ).join("");


    /*
       방장만 시작 가능
    */

    if (
        roomData.host === myId &&
        roomData.status === "lobby"
    ) {

        $("startButton")
            .style
            .display =
            "inline-block";

    } else {

        $("startButton")
            .style
            .display =
            "none";

    }


    if (
        roomData.host === myId
    ) {

        $("lobbyStatus")
            .textContent =
            "방장이야! 사람이 모이면 게임을 시작해.";

    } else {

        $("lobbyStatus")
            .textContent =
            "방장이 게임을 시작할 때까지 기다려!";

    }

}



/* =========================================================
   게임 상태
========================================================= */

function renderGameState() {

    if (
        roomData.status ===
        "classSelect"
    ) {

        showClassSelection();

    }


    if (
        roomData.status === "playing" ||
        roomData.status === "finished"
    ) {

        $("lobby")
            .classList
            .add("hidden");


        $("classSelect")
            .classList
            .add("hidden");


        $("game")
            .classList
            .remove("hidden");


        renderGame();

    }

}



/* =========================================================
   클래스 선택 시작
========================================================= */

window.startClassSelection =
async function() {

    if (
        roomData.host !== myId
    ) {

        return;

    }


    await update(

        ref(
            db,
            `rooms/${roomId}`
        ),

        {

            status: "classSelect",

            classEndsAt:
                Date.now() + 10000,

            lastMessage:
                "🧑‍🚀 클래스 선택!"

        }

    );

};



/* =========================================================
   클래스 선택 화면
========================================================= */

function showClassSelection() {

    $("lobby")
        .classList
        .add("hidden");


    $("game")
        .classList
        .add("hidden");


    $("classSelect")
        .classList
        .remove("hidden");


    const remain =
        Math.max(

            0,

            Math.ceil(
                (
                    roomData.classEndsAt -
                    Date.now()
                ) / 1000
            )

        );


    $("classTimer")
        .textContent =
        remain;


    if (remain > 0) {

        $("classStatus")
            .textContent =
            "10초 안에 클래스를 골라!";

    } else {

        $("classStatus")
            .textContent =
            "⚔️ 클래스 확정!";

    }


    /*
       시간이 끝났으면 방장이 전투 시작
    */

    if (
        remain <= 0 &&
        roomData.host === myId
    ) {

        startBattle();

    }

}



/* =========================================================
   클래스 선택
========================================================= */

window.selectClass =
async function(className) {

    if (
        !roomData ||
        roomData.status !==
        "classSelect"
    ) {

        return;

    }


    /*
       버튼 표시
    */

    document
        .querySelectorAll(
            ".class-button"
        )
        .forEach(button => {

            button
                .classList
                .toggle(
                    "selected",
                    button.dataset.class ===
                    className
                );

        });


    /*
       Firebase 저장
    */

    await update(

        ref(
            db,
            `rooms/${roomId}/players/${myId}`
        ),

        {

            class: className

        }

    );

};



/* =========================================================
   직업 효과 도우미
========================================================= */

function teamHPKey(team) {
    return team === "blue" ? "blueHP" : "redHP";
}

function enemyTeamOf(team) {
    return team === "blue" ? "red" : "blue";
}

function teamCount(players, team) {
    return Object.values(players || {})
        .filter(p => p.team === team).length;
}

function getKingBonus(players, me) {
    if (!me || me.class !== "king") return 1;
    const count = teamCount(players, me.team);
    return 1 + Math.max(0, count - 1) * 0.05;
}

async function setTeamEffect(path, value) {
    await update(ref(db, `rooms/${roomId}`), { [path]: value });
}

/* =========================================================
   실제 게임 시작
========================================================= */

async function startBattle() {

    if (roomData.status !== "classSelect") {
        return;
    }

    // 문제는 방 전체가 아니라 각 플레이어에게 따로 생성한다.
    const players = roomData.players || {};
    const playerUpdates = {};

    Object.keys(players).forEach(id => {
        const word = randomWord();

        playerUpdates[`players/${id}/question`] = word[0];
        playerUpdates[`players/${id}/answer`] = word[1];
        playerUpdates[`players/${id}/difficulty`] = word[2];
        playerUpdates[`players/${id}/questionId`] = crypto.randomUUID();
    });

    // 팀 인원수에 따라 최대 HP 결정: 100 + 10 × 팀 인원수
    const blueCount = Object.values(players).filter(p => p.team === "blue").length;
    const redCount = Object.values(players).filter(p => p.team === "red").length;

    playerUpdates.status = "playing";
    playerUpdates.blueHP = 100 + 10 * blueCount;
    playerUpdates.redHP = 100 + 10 * redCount;
    playerUpdates.attackCount = 0;
    playerUpdates.confusionUntil = {};
    playerUpdates.debuffs = {};
    playerUpdates.lastMessage = `🔥 GAME START! BLUE ${playerUpdates.blueHP} HP / RED ${playerUpdates.redHP} HP`;

    await update(
        ref(db, `rooms/${roomId}`),
        playerUpdates
    );
}

/* =========================================================
   게임 렌더링
========================================================= */

function renderGame() {

    const blueHP =
        Math.max(
            0,
            roomData.blueHP ?? 100
        );


    const redHP =
        Math.max(
            0,
            roomData.redHP ?? 100
        );


    $("blueHPText")
        .textContent =
        blueHP;


    $("redHPText")
        .textContent =
        redHP;


    $("blueHPBar")
        .style
        .width =
        blueHP + "%";


    $("redHPBar")
        .style
        .width =
        redHP + "%";


    const players =
        roomData.players || {};

    // ★ 현재 접속자의 문제만 표시
    const me =
        players[myId];

    $("meaning")
        .textContent =
        (me && me.question) || "-";

    $("difficulty")
        .textContent =
        "난이도: " +
        String(
            (me && me.difficulty) ||
            "easy"
        ).toUpperCase();


    /*
       BLUE
    */

    $("bluePlayers")
        .innerHTML =

        Object.values(players)

        .filter(
            p => p.team === "blue"
        )

        .map(

            p => `

            <div class="player">

                ${classIcon(p.class)}

                ${p.name}

            </div>

            `

        )

        .join("");


    /*
       RED
    */

    $("redPlayers")
        .innerHTML =

        Object.values(players)

        .filter(
            p => p.team === "red"
        )

        .map(

            p => `

            <div class="player">

                ${classIcon(p.class)}

                ${p.name}

            </div>

            `

        )

        .join("");


    $("status")
        .textContent =
        roomData.lastMessage || "";

    // CONFUSER: 내 팀이 공격받아 혼란 상태라면 1초 동안 표시
    const confusionUntil = roomData.confusionUntil || {};
    const confused = Number(confusionUntil[myTeam] || 0) > Date.now();
    $("battleEffect").classList.toggle("show", confused);

    const debuffs = roomData.debuffs || {};
    const myDebuff = debuffs[myTeam];
    if (myDebuff && Number(myDebuff.until || 0) > Date.now()) {
        $("debuffStatus").textContent =
            `🧪 ${myDebuff.label} (${Math.max(0, Math.ceil((myDebuff.until - Date.now()) / 1000))}초)`;
    } else {
        $("debuffStatus").textContent = "";
    }


    /*
       게임 종료
    */

    if (
        roomData.status ===
        "finished"
    ) {

        $("attackButton")
            .disabled = true;


        $("hintButton")
            .disabled = true;


        $("answer")
            .disabled = true;


        $("status")
            .textContent =

            blueHP <= 0

                ? "🔴 RED TEAM 승리! 🏆"

                : "🔵 BLUE TEAM 승리! 🏆";

    }

}



/* =========================================================
   총알 애니메이션
========================================================= */

function shoot(team) {

    const bullet =
        document.createElement("div");


    bullet.className =
        "bullet " +
        (
            team === "blue"
            ? "blue-shot"
            : "red-shot"
        );


    document
        .querySelector(".arena")
        .appendChild(
            bullet
        );


    setTimeout(

        () => bullet.remove(),

        450

    );

}



/* =========================================================
   HINT
   홀수 번째 글자 공개
========================================================= */

window.useHint =
function() {

    if (hintUsed) {

        return;

    }


    if (
        !roomData ||
        roomData.status !==
        "playing"
    ) {

        return;

    }


    hintUsed = true;


    const players =
        roomData.players || {};

    const me =
        players[myId];

    if (!me) {
        return;
    }

    const answer =
        String(
            me.answer || ""
        ).toLowerCase();


    let result = "";


    for (
        let i = 0;
        i < answer.length;
        i++
    ) {

        /*
           배열 인덱스는 0부터 시작

           0 = 1번째
           2 = 3번째
           4 = 5번째

           따라서 홀수 번째 글자를 보여줌
        */

        if (
            i % 2 === 0
        ) {

            result +=
                answer[i];

        } else {

            result += "_";

        }


        if (
            i <
            answer.length - 1
        ) {

            result += " ";

        }

    }


    $("hint")
        .textContent =
        "💡 " + result;


    $("hintButton")
        .disabled = true;


    $("status")
        .textContent =
        "⚠️ 힌트 사용! 이번 공격 데미지 50% 감소";

};



/* =========================================================
   공격
========================================================= */

window.submitAnswer =
async function() {

    if (!roomData || roomData.status !== "playing") {
        return;
    }

    const input = $("answer");
    const answer = input.value.trim().toLowerCase();
    input.value = "";

    if (!answer) return;

    const players = roomData.players || {};
    const me = players[myId];
    if (!me) return;

    // 내 문제의 정답만 검사
    const correctAnswer = String(me.answer || "").toLowerCase();
    if (answer !== correctAnswer) {
        $("status").textContent = "❌ 오답!";
        return;
    }

    const questionId = me.questionId;
    if (!questionId) return;

    // 같은 문제 중복 제출 방지
    const claim = await runTransaction(
        ref(db, `rooms/${roomId}/players/${myId}/questionId`),
        currentId => currentId === questionId ? "__processing__" : undefined
    );

    if (!claim.committed) return;

    const difficulty = me.difficulty || "easy";
    let damage = difficulty === "hard" ? 25 : difficulty === "normal" ? 15 : 10;

    // RUSHER
    if (me.class === "rusher") {
        damage = Math.round(damage * 1.2);
    }

    // SNIPER
    if (me.class === "sniper" && difficulty === "hard") {
        damage += 10;
    }

    // KING: 팀원이 많을수록 공격 보너스
    damage = Math.max(1, Math.round(damage * getKingBonus(players, me)));

    // HINT
    if (hintUsed) {
        damage = Math.max(1, Math.floor(damage * 0.5));
    }

    const enemyTeam = enemyTeamOf(myTeam);
    const ownHPKey = teamHPKey(myTeam);
    const enemyHPKey = teamHPKey(enemyTeam);

    // DEBUFFER: 상대 팀에 걸린 공격력 감소
    const activeDebuff = (roomData.debuffs || {})[myTeam];
    if (activeDebuff && Number(activeDebuff.until || 0) > Date.now() && activeDebuff.type === "weak") {
        damage = Math.max(1, Math.floor(damage * 0.7));
    }

    // 상대 GUARDIAN 수에 따른 피해 감소
    const enemyGuardians = Object.values(players)
        .filter(p => p.team === enemyTeam && p.class === "guardian")
        .length;

    if (enemyGuardians > 0) {
        // 1명당 20% 감소, 5명이어도 완전 무적은 아니게 최대 80% 감소
        const reduction = Math.min(0.8, enemyGuardians * 0.2);
        damage = Math.max(1, Math.round(damage * (1 - reduction)));
    }

    // CHAOS: 성공한 공격마다 4가지 효과 중 하나
    let chaosMessage = "";
    if (me.class === "chaos") {
        const effects = ["damageUp", "damageDown", "heal", "hurt"];
        const effect = effects[Math.floor(Math.random() * effects.length)];

        if (effect === "damageUp") {
            damage = Math.round(damage * 1.5);
            chaosMessage = "🎲 CHAOS: 데미지 증가!";
        } else if (effect === "damageDown") {
            damage = Math.max(1, Math.floor(damage * 0.5));
            chaosMessage = "🎲 CHAOS: 데미지 감소...";
        } else if (effect === "heal") {
            await runTransaction(ref(db, `rooms/${roomId}/${ownHPKey}`), currentHP => {
                currentHP = currentHP ?? 100;
                return Math.min(150, currentHP + 10);
            });
            chaosMessage = "🎲 CHAOS: 우리 팀 HP +10!";
        } else {
            damage += 10;
            chaosMessage = "🎲 CHAOS: 추가 피해 +10!";
        }
    }

    shoot(myTeam);

    // 실제 적 팀 HP 감소
    const hpResult = await runTransaction(
        ref(db, `rooms/${roomId}/${enemyHPKey}`),
        currentHP => Math.max(0, (currentHP ?? 100) - damage)
    );

    if (!hpResult.committed) return;

    // 공격 횟수 증가. EQUALIZER의 '5번째 공격' 판정 기준
    const countResult = await runTransaction(
        ref(db, `rooms/${roomId}/attackCount`),
        current => (current ?? 0) + 1
    );
    const attackCount = countResult.snapshot.val() || 0;

    // CONFUSER: 상대 팀 전체 화면을 1초간 혼란
    if (me.class === "confuser") {
        await setTeamEffect(`confusionUntil/${enemyTeam}`, Date.now() + 1000);
    }

    // DEBUFFER: 상대 팀 공격력 30% 감소, 5~10초
    if (me.class === "debuff") {
        const duration = 5000 + Math.floor(Math.random() * 5001);
        await setTeamEffect(`debuffs/${enemyTeam}`, {
            type: "weak",
            label: "공격력 30% 감소",
            until: Date.now() + duration
        });
    }

    // MIRROR: 공격받은 팀의 MIRROR가 20% 확률로 피해 일부 반사
    const mirrorCount = Object.values(players)
        .filter(p => p.team === enemyTeam && p.class === "mirror")
        .length;

    if (mirrorCount > 0 && Math.random() < 0.20) {
        const reflected = Math.max(1, Math.floor(damage * 0.5));
        await runTransaction(ref(db, `rooms/${roomId}/${ownHPKey}`), currentHP =>
            Math.max(0, (currentHP ?? 100) - reflected)
        );
        $("status").textContent = `🪞 MIRROR 발동! ${reflected} 피해 반사!`;
    }

    // EQUALIZER: 5번째 공격마다 20% 확률
    if (me.class === "equalizer" && attackCount % 5 === 0 && Math.random() < 0.20) {
        const ownSnapshot = await get(ref(db, `rooms/${roomId}/${ownHPKey}`));
        const ownHP = ownSnapshot.val() ?? 0;

        await runTransaction(ref(db, `rooms/${roomId}/${enemyHPKey}`), currentHP => {
            // 이미 더 낮아졌다면 우리 HP로 맞춘다. 최대 150까지 가능.
            return Math.max(0, Math.min(150, ownHP));
        });

        $("status").textContent = `⚖️ EQUALIZER 발동! 상대 팀 HP → ${ownHP}`;
    }

    // 현재 적 HP 확인
    const latestEnemy = await get(ref(db, `rooms/${roomId}/${enemyHPKey}`));
    const newEnemyHP = latestEnemy.val() ?? 0;

    if (newEnemyHP <= 0) {
        await update(ref(db, `rooms/${roomId}`), {
            status: "finished",
            lastMessage: `💥 ${myName}의 공격! ${damage} DAMAGE`
        });
        resetHint();
        return;
    }

    // 정답을 맞힌 사람만 자기 다음 문제를 받는다.
    const nextWord = randomWord();
    await update(ref(db, `rooms/${roomId}/players/${myId}`), {
        question: nextWord[0],
        answer: nextWord[1],
        difficulty: nextWord[2],
        questionId: crypto.randomUUID()
    });

    resetHint();

    const messages = [];
    if (chaosMessage) messages.push(chaosMessage);
    if (me.class === "confuser") messages.push("🌀 상대 화면 혼란 1초!");
    if (me.class === "debuff") messages.push("🧪 상대 팀 공격력 30% 감소!");
    if (me.class === "equalizer" && attackCount % 5 === 0) messages.push("⚖️ 5번째 공격 판정!");

    $("status").textContent =
        messages.length ? messages.join(" ") : `⚡ ${damage} DAMAGE!`;
};


/* =========================================================
   힌트 초기화
========================================================= */

function resetHint() {

    hintUsed = false;


    $("hint")
        .textContent = "";


    $("hintButton")
        .disabled = false;

}



/* =========================================================
   ENTER = 공격
========================================================= */

$("answer")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                submitAnswer();

            }

        }
    );



/* =========================================================
   클래스 선택 타이머
========================================================= */

setInterval(

    () => {

        if (
            roomData &&
            roomData.status ===
            "classSelect"
        ) {

            showClassSelection();

        }

    },

    250

);

</script>
