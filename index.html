<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Attack 5v5</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #08111f;
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    font-size: 42px;
}

.card {
    background: #16243a;
    border-radius: 18px;
    padding: 20px;
    margin: 15px 0;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

.hidden {
    display: none;
}

input {
    padding: 12px;
    border: none;
    border-radius: 10px;
    margin: 5px;
    font-size: 16px;
}

button {
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    margin: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #347ff0;
    color: white;
}

button:hover {
    transform: translateY(-1px);
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* 팀 */

.teams {
    display: flex;
    gap: 15px;
}

.team {
    flex: 1;
    padding: 18px;
    border-radius: 18px;
}

.blue {
    background: #104875;
}

.red {
    background: #721f32;
}

.hp-bar {
    width: 100%;
    height: 24px;
    background: #07101c;
    border-radius: 20px;
    overflow: hidden;
}

.hp {
    height: 100%;
    transition: width 0.3s;
}

.blue-hp {
    background: #38aaff;
}

.red-hp {
    background: #ff5068;
}

.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 12px;
}

.player {
    padding: 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.12);
}

/* 클래스 */

.class-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.class-button {
    background: #263750;
    border: 3px solid transparent;
    padding: 20px 10px;
}

.class-button.selected {
    border-color: white;
    background: #3b526f;
}

.class-button b {
    display: block;
    font-size: 20px;
    margin-bottom: 8px;
}

#classTimer {
    text-align: center;
    font-size: 65px;
    font-weight: bold;
}

/* 전투 */

.arena {
    height: 150px;
    background: linear-gradient(
        #111f33,
        #091321
    );

    border-radius: 15px;

    position: relative;

    overflow: hidden;

    margin-bottom: 20px;
}

.fighter {
    position: absolute;
    top: 50px;
    font-size: 45px;
}

.blue-fighter {
    left: 8%;
}

.red-fighter {
    right: 8%;
}

.bullet {
    position: absolute;
    top: 72px;
    height: 8px;
    border-radius: 10px;
    animation: shoot 0.4s linear forwards;
}

.blue-shot {
    left: 10%;
    background: #4cc8ff;
}

.red-shot {
    right: 10%;
    background: #ff5068;
}

@keyframes shoot {

    from {
        width: 0;
    }

    to {
        width: 80%;
    }

}

#meaning {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    margin: 20px;
}

#difficulty {
    text-align: center;
    color: #b7c4d8;
}

#hint {
    text-align: center;
    font-size: 25px;
    letter-spacing: 4px;
    min-height: 35px;
}

#status {
    text-align: center;
    min-height: 25px;
}

.center {
    text-align: center;
}

.small {
    color: #aebbd0;
}

@media(max-width:700px) {

    .teams {
        flex-direction: column;
    }

    .class-grid {
        grid-template-columns: 1fr 1fr;
    }

    #meaning {
        font-size: 30px;
    }

}

</style>
</head>

<script type="module">


/* =========================================================

import {
    getDatabase,
    ref,
    set,
    get,
    update,
    onValue,
    runTransaction
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAJThRurWqXvOTXLnTmnbbMGyhA3Karfc8",

    authDomain:
        "ward-gun.firebaseapp.com",

    databaseURL:
        "https://ward-gun-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "ward-gun",

    storageBucket:
        "ward-gun.firebasestorage.app",

    messagingSenderId:
        "271533385614",

    appId:
        "1:271533385614:web:7058ac44bdbd247a0ca6df",

    measurementId:
        "G-XWC1H0TF94"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);



/* =========================================================
   기본 변수
========================================================= */

const myId =
    crypto.randomUUID();

let myName = "";

let roomId = "";

let myTeam = "";

let roomData = null;

let unsubscribe = null;

let hintUsed = false;



/* =========================================================
   영어 단어
========================================================= */

const WORDS = [

    ["사과", "apple", "easy"],
    ["바나나", "banana", "easy"],
    ["강아지", "dog", "easy"],
    ["고양이", "cat", "easy"],
    ["책", "book", "easy"],
    ["학교", "school", "easy"],
    ["집", "house", "easy"],
    ["물", "water", "easy"],
    ["음식", "food", "easy"],
    ["친구", "friend", "easy"],

    ["가족", "family", "easy"],
    ["선생님", "teacher", "easy"],
    ["학생", "student", "easy"],
    ["자동차", "car", "easy"],
    ["공", "ball", "easy"],
    ["나무", "tree", "easy"],
    ["태양", "sun", "easy"],
    ["달", "moon", "easy"],
    ["비", "rain", "easy"],
    ["눈", "snow", "easy"],

    ["가다", "go", "easy"],
    ["오다", "come", "easy"],
    ["먹다", "eat", "easy"],
    ["마시다", "drink", "easy"],
    ["자다", "sleep", "easy"],
    ["달리다", "run", "easy"],
    ["걷다", "walk", "easy"],
    ["보다", "see", "easy"],
    ["읽다", "read", "easy"],
    ["쓰다", "write", "easy"],

    ["놀다", "play", "easy"],
    ["좋아하다", "like", "easy"],
    ["만들다", "make", "easy"],
    ["큰", "big", "easy"],
    ["작은", "small", "easy"],
    ["좋은", "good", "easy"],
    ["나쁜", "bad", "easy"],
    ["빠른", "fast", "easy"],
    ["느린", "slow", "easy"],
    ["행복한", "happy", "easy"],

    ["아름다운", "beautiful", "normal"],
    ["여행", "travel", "normal"],
    ["동물", "animal", "normal"],
    ["아침", "morning", "normal"],
    ["필요한", "necessary", "normal"],
    ["재미있는", "interesting", "normal"],
    ["중요한", "important", "normal"],

    ["환경", "environment", "hard"],
    ["모험", "adventure", "hard"],
    ["갑자기", "suddenly", "hard"],
    ["가능한", "possible", "hard"]

];



/* =========================================================
   도우미
========================================================= */

function $(id) {

    return document.getElementById(id);

}


function randomWord() {

    return WORDS[
        Math.floor(
            Math.random() * WORDS.length
        )
    ];

}


function randomRoomCode() {

    return Math.random()
        .toString(36)
        .substring(2, 7)
        .toUpperCase();

}


function classIcon(className) {

    const icons = {

        rusher: "⚡",

        guardian: "🛡️",

        sniper: "🎯",

        support: "💚"

    };

    return icons[className] || "❔";

}



/* =========================================================
   방 만들기
========================================================= */

window.createRoom = async function() {

    myName =
        $("playerName")
        .value
        .trim();


    if (!myName) {

        alert("닉네임을 입력해!");

        return;

    }


    roomId =
        randomRoomCode();


    myTeam =
        "blue";


    await set(

        ref(
            db,
            `rooms/${roomId}`
        ),

        {

            host: myId,

            status: "lobby",

            blueHP: 100,

            redHP: 100,

            players: {

                [myId]: {

                    name: myName,

                    team: "blue",

                    class: ""

                }

            }

        }

    );


    showLobby();

    listenRoom();

};



/* =========================================================
   방 참가
========================================================= */

window.joinRoom = async function() {

    myName =
        $("playerName")
        .value
        .trim();


    roomId =
        $("roomCodeInput")
        .value
        .trim()
        .toUpperCase();


    if (!myName || !roomId) {

        alert(
            "닉네임과 방 코드를 입력해!"
        );

        return;

    }


    const snapshot =
        await get(
            ref(
                db,
                `rooms/${roomId}`
            )
        );


    if (!snapshot.exists()) {

        alert(
            "그런 방이 없어!"
        );

        return;

    }


    const data =
        snapshot.val();


    const players =
        data.players || {};


    if (data.status !== "lobby") {

        alert(
            "이미 게임이 시작된 방이야!"
        );

        return;

    }


    if (
        Object.keys(players).length >= 10
    ) {

        alert(
            "방이 꽉 찼어!"
        );

        return;

    }


    const blueCount =
        Object.values(players)
        .filter(
            p => p.team === "blue"
        )
        .length;


    const redCount =
        Object.values(players)
        .filter(
            p => p.team === "red"
        )
        .length;


    /*
       사람이 적은 팀으로 자동 배정
    */

    myTeam =
        blueCount <= redCount
            ? "blue"
            : "red";


    await update(

        ref(
            db,
            `rooms/${roomId}/players/${myId}`
        ),

        {

            name: myName,

            team: myTeam,

            class: ""

        }

    );


    showLobby();

    listenRoom();

};



/* =========================================================
   로비 표시
========================================================= */

function showLobby() {

    $("login")
        .classList
        .add("hidden");


    $("lobby")
        .classList
        .remove("hidden");


    $("roomCode")
        .textContent =
        roomId;

}



/* =========================================================
   Firebase 방 감시
========================================================= */

function listenRoom() {

    if (unsubscribe) {

        unsubscribe();

    }


    unsubscribe =
        onValue(

            ref(
                db,
                `rooms/${roomId}`
            ),

            snapshot => {

                roomData =
                    snapshot.val();


                if (!roomData) {

                    return;

                }


                renderLobby();

                renderGameState();

            }

        );

}



/* =========================================================
   로비 렌더링
========================================================= */

function renderLobby() {

    const players =
        roomData.players || {};


    const list =
        Object.entries(players);


    $("playerCount")
        .textContent =
        list.length;


    $("lobbyPlayers")
        .innerHTML =

        list.map(

            ([id, player]) => `

            <div class="player">

                ${
                    player.team === "blue"
                    ? "🔵"
                    : "🔴"
                }

                ${player.name}

                ${classIcon(player.class)}

                ${
                    id === roomData.host
                    ? "👑"
                    : ""
                }

            </div>

            `

        ).join("");


    /*
       방장만 시작 가능
    */

    if (
        roomData.host === myId &&
        roomData.status === "lobby"
    ) {

        $("startButton")
            .style
            .display =
            "inline-block";

    } else {

        $("startButton")
            .style
            .display =
            "none";

    }


    if (
        roomData.host === myId
    ) {

        $("lobbyStatus")
            .textContent =
            "방장이야! 사람이 모이면 게임을 시작해.";

    } else {

        $("lobbyStatus")
            .textContent =
            "방장이 게임을 시작할 때까지 기다려!";

    }

}



/* =========================================================
   게임 상태
========================================================= */

function renderGameState() {

    if (
        roomData.status ===
        "classSelect"
    ) {

        showClassSelection();

    }


    if (
        roomData.status === "playing" ||
        roomData.status === "finished"
    ) {

        $("lobby")
            .classList
            .add("hidden");


        $("classSelect")
            .classList
            .add("hidden");


        $("game")
            .classList
            .remove("hidden");


        renderGame();

    }

}



/* =========================================================
   클래스 선택 시작
========================================================= */

window.startClassSelection =
async function() {

    if (
        roomData.host !== myId
    ) {

        return;

    }


    await update(

        ref(
            db,
            `rooms/${roomId}`
        ),

        {

            status: "classSelect",

            classEndsAt:
                Date.now() + 10000,

            lastMessage:
                "🧑‍🚀 클래스 선택!"

        }

    );

};



/* =========================================================
   클래스 선택 화면
========================================================= */

function showClassSelection() {

    $("lobby")
        .classList
        .add("hidden");


    $("game")
        .classList
        .add("hidden");


    $("classSelect")
        .classList
        .remove("hidden");


    const remain =
        Math.max(

            0,

            Math.ceil(
                (
                    roomData.classEndsAt -
                    Date.now()
                ) / 1000
            )

        );


    $("classTimer")
        .textContent =
        remain;


    if (remain > 0) {

        $("classStatus")
            .textContent =
            "10초 안에 클래스를 골라!";

    } else {

        $("classStatus")
            .textContent =
            "⚔️ 클래스 확정!";

    }


    /*
       시간이 끝났으면 방장이 전투 시작
    */

    if (
        remain <= 0 &&
        roomData.host === myId
    ) {

        startBattle();

    }

}



/* =========================================================
   클래스 선택
========================================================= */

window.selectClass =
async function(className) {

    if (
        !roomData ||
        roomData.status !==
        "classSelect"
    ) {

        return;

    }


    /*
       버튼 표시
    */

    document
        .querySelectorAll(
            ".class-button"
        )
        .forEach(button => {

            button
                .classList
                .toggle(
                    "selected",
                    button.dataset.class ===
                    className
                );

        });


    /*
       Firebase 저장
    */

    await update(

        ref(
            db,
            `rooms/${roomId}/players/${myId}`
        ),

        {

            class: className

        }

    );

};



/* =========================================================
   실제 게임 시작
========================================================= */

async function startBattle() {

    if (
        roomData.status !==
        "classSelect"
    ) {

        return;

    }


    const word =
        randomWord();


    await update(

        ref(
            db,
            `rooms/${roomId}`
        ),

        {

            status: "playing",

            blueHP: 100,

            redHP: 100,

            question: word[0],

            answer: word[1],

            difficulty: word[2],

            round: 1,

            lastMessage:
                "🔥 GAME START!"

        }

    );

}



/* =========================================================
   게임 렌더링
========================================================= */

function renderGame() {

    const blueHP =
        Math.max(
            0,
            roomData.blueHP ?? 100
        );


    const redHP =
        Math.max(
            0,
            roomData.redHP ?? 100
        );


    $("blueHPText")
        .textContent =
        blueHP;


    $("redHPText")
        .textContent =
        redHP;


    $("blueHPBar")
        .style
        .width =
        blueHP + "%";


    $("redHPBar")
        .style
        .width =
        redHP + "%";


    $("meaning")
        .textContent =
        roomData.question || "-";


    $("difficulty")
        .textContent =
        "난이도: " +
        String(
            roomData.difficulty ||
            "easy"
        ).toUpperCase();


    const players =
        roomData.players || {};


    /*
       BLUE
    */

    $("bluePlayers")
        .innerHTML =

        Object.values(players)

        .filter(
            p => p.team === "blue"
        )

        .map(

            p => `

            <div class="player">

                ${classIcon(p.class)}

                ${p.name}

            </div>

            `

        )

        .join("");


    /*
       RED
    */

    $("redPlayers")
        .innerHTML =

        Object.values(players)

        .filter(
            p => p.team === "red"
        )

        .map(

            p => `

            <div class="player">

                ${classIcon(p.class)}

                ${p.name}

            </div>

            `

        )

        .join("");


    $("status")
        .textContent =
        roomData.lastMessage || "";


    /*
       게임 종료
    */

    if (
        roomData.status ===
        "finished"
    ) {

        $("attackButton")
            .disabled = true;


        $("hintButton")
            .disabled = true;


        $("answer")
            .disabled = true;


        $("status")
            .textContent =

            blueHP <= 0

                ? "🔴 RED TEAM 승리! 🏆"

                : "🔵 BLUE TEAM 승리! 🏆";

    }

}



/* =========================================================
   총알 애니메이션
========================================================= */

function shoot(team) {

    const bullet =
        document.createElement("div");


    bullet.className =
        "bullet " +
        (
            team === "blue"
            ? "blue-shot"
            : "red-shot"
        );


    document
        .querySelector(".arena")
        .appendChild(
            bullet
        );


    setTimeout(

        () => bullet.remove(),

        450

    );

}



/* =========================================================
   HINT
   홀수 번째 글자 공개
========================================================= */

window.useHint =
function() {

    if (hintUsed) {

        return;

    }


    if (
        !roomData ||
        roomData.status !==
        "playing"
    ) {

        return;

    }


    hintUsed = true;


    const answer =
        String(
            roomData.answer
        ).toLowerCase();


    let result = "";


    for (
        let i = 0;
        i < answer.length;
        i++
    ) {

        /*
           배열 인덱스는 0부터 시작

           0 = 1번째
           2 = 3번째
           4 = 5번째

           따라서 홀수 번째 글자를 보여줌
        */

        if (
            i % 2 === 0
        ) {

            result +=
                answer[i];

        } else {

            result += "_";

        }


        if (
            i <
            answer.length - 1
        ) {

            result += " ";

        }

    }


    $("hint")
        .textContent =
        "💡 " + result;


    $("hintButton")
        .disabled = true;


    $("status")
        .textContent =
        "⚠️ 힌트 사용! 이번 공격 데미지 50% 감소";

};



/* =========================================================
   공격
========================================================= */

window.submitAnswer =
async function() {

    if (
        !roomData ||
        roomData.status !==
        "playing"
    ) {

        return;

    }


    const input =
        $("answer");


    const answer =
        input.value
            .trim()
            .toLowerCase();


    input.value = "";


    if (!answer) {

        return;

    }


    const correctAnswer =
        String(
            roomData.answer
        )
        .toLowerCase();


    /*
       오답
    */

    if (
        answer !==
        correctAnswer
    ) {

        $("status")
            .textContent =
            "❌ 오답!";

        return;

    }


    /*
       같은 문제를 여러 명이
       동시에 맞히는 문제 방지
    */

    const transaction =
        await runTransaction(

            ref(
                db,
                `rooms/${roomId}/round`
            ),

            currentRound => {

                if (
                    currentRound ===
                    roomData.round
                ) {

                    return (
                        currentRound + 1
                    );

                }


                return;

            }

        );


    if (
        !transaction.committed
    ) {

        return;

    }


    const players =
        roomData.players || {};


    const me =
        players[myId];


    if (!me) {

        return;

    }


    const difficulty =
        roomData.difficulty ||
        "easy";


    /*
       기본 데미지
    */

    let damage = 10;


    if (
        difficulty ===
        "normal"
    ) {

        damage = 15;

    }


    if (
        difficulty ===
        "hard"
    ) {

        damage = 25;

    }


    /* =========================
       RUSHER
    ========================= */

    if (
        me.class ===
        "rusher"
    ) {

        damage =
            Math.round(
                damage * 1.2
            );

    }


    /* =========================
       SNIPER
    ========================= */

    if (
        me.class ===
        "sniper" &&
        difficulty ===
        "hard"
    ) {

        damage += 10;

    }


    /* =========================
       HINT
    ========================= */

    if (hintUsed) {

        damage =
            Math.max(
                1,
                Math.floor(
                    damage * 0.5
                )
            );

    }


    /* =========================
       SUPPORT
    ========================= */

    if (
        me.class ===
        "support"
    ) {

        const ownHPKey =
            myTeam === "blue"
                ? "blueHP"
                : "redHP";


        const currentHP =
            roomData[
                ownHPKey
            ] ?? 100;


        /*
           현재 체력의 5%
        */

        const heal =
            Math.max(
                1,
                Math.ceil(
                    currentHP * 0.05
                )
            );


        const newHP =
            Math.min(
                100,
                currentHP + heal
            );


        const nextWord =
            randomWord();


        await update(

            ref(
                db,
                `rooms/${roomId}`
            ),

            {

                [ownHPKey]:
                    newHP,

                question:
                    nextWord[0],

                answer:
                    nextWord[1],

                difficulty:
                    nextWord[2],

                lastMessage:

                    `💚 ${myName} 지원! ` +
                    `팀 HP +${heal}`

            }

        );


        resetHint();

        return;

    }


    /* =========================
       적 팀
    ========================= */

    const enemyHPKey =
        myTeam === "blue"
            ? "redHP"
            : "blueHP";


    let enemyHP =
        roomData[
            enemyHPKey
        ] ?? 100;


    /* =========================
       GUARDIAN
    ========================= */

    const enemyGuardians =
        Object.values(players)
            .filter(

                p =>
                    p.team !== myTeam &&
                    p.class === "guardian"

            )
            .length;


    if (
        enemyGuardians > 0
    ) {

        /*
           GUARDIAN이 있으면
           받는 피해 20% 감소

           여러 명 있어도
           과도하게 100% 감소하지 않도록
           한 번만 적용
        */

        damage =
            Math.max(
                1,
                Math.round(
                    damage * 0.8
                )
            );

    }


    shoot(myTeam);


    const newEnemyHP =
        Math.max(
            0,
            enemyHP - damage
        );


    /* =========================
       승리
    ========================= */

    if (
        newEnemyHP <= 0
    ) {

        await update(

            ref(
                db,
                `rooms/${roomId}`
            ),

            {

                [enemyHPKey]: 0,

                status:
                    "finished",

                lastMessage:

                    `💥 ${myName}의 공격! ` +
                    `${damage} DAMAGE`

            }

        );


        resetHint();

        return;

    }


    /* =========================
       다음 문제
    ========================= */

    const nextWord =
        randomWord();


    await update(

        ref(
            db,
            `rooms/${roomId}`
        ),

        {

            [enemyHPKey]:
                newEnemyHP,

            question:
                nextWord[0],

            answer:
                nextWord[1],

            difficulty:
                nextWord[2],

            lastMessage:

                `⚡ ${myName} 정답! ` +
                `${damage} DAMAGE`

        }

    );


    resetHint();

};



/* =========================================================
   힌트 초기화
========================================================= */

function resetHint() {

    hintUsed = false;


    $("hint")
        .textContent = "";


    $("hintButton")
        .disabled = false;

}



/* =========================================================
   ENTER = 공격
========================================================= */

$("answer")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                submitAnswer();

            }

        }
    );



/* =========================================================
   클래스 선택 타이머
========================================================= */

setInterval(

    () => {

        if (
            roomData &&
            roomData.status ===
            "classSelect"
        ) {

            showClassSelection();

        }

    },

    250

);

</script>
